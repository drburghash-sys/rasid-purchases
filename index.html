<header class="header"><div class="wrap"><div class="brandrow"><div class="brand"><div class="mark" style="background:none;box-shadow:none"><img src="./icon.png" alt="أيقونة راصد المشتريات" style="width:100%;height:100%;border-radius:15px;object-fit:cover"></div><div><h1>راصد المشتريات</h1><small>كل فاتورة تصبح قرارًا أذكى</small></div></div><div class="head-action"><span class="top-meta">◉ بياناتك على جهازك</span><button class="outline-light" type="button" id="quickAdd">＋ فاتورة</button></div></div><nav class="mainnav" id="nav" aria-label="أقسام التطبيق"></nav></div></header>
<main class="wrap main"><div id="app"></div></main><footer class="foot">راصد المشتريات • حفظ محلي على هذا المتصفح • يُنصح بنسخة احتياطية دورية</footer><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const KEY='rasid-purchases-v1';
const CATS=['خضار وفواكه','لحوم ودواجن','ألبان وأجبان','مخبوزات','معلبات','منظفات','مشروبات','بهارات','حلويات','أخرى'];
const NAV=[['dashboard','الرئيسية'],['receipts','الفواتير'],['prices','الأسعار'],['budget','الميزانية'],['import','استيراد من الشات'],['settings','الإعدادات']];
const AED=(n)=> (Number.isFinite(Number(n))?Number(n):0).toLocaleString('ar-SA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.س';
const NUM=(n)=>Number(n||0).toLocaleString('ar-SA');
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const money=x=>Math.round((Number(x)||0)*100)/100;
const cents=x=>Math.round((Number(x)||0)*100);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const thisMonth=()=>today().slice(0,7);
const prevMonth=s=>{let [y,m]=s.split('-').map(Number);return new Date(y,m-2,1).toISOString().slice(0,7)};
const monthTitle=m=>new Intl.DateTimeFormat('ar-SA',{year:'numeric',month:'long',calendar:'gregory'}).format(new Date(m+'-01T12:00:00'));
const uuid=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2);
function blankState(){return {version:1,receipts:[],budget:0,catBudgets:{},categories:CATS.slice()};}
function load(){
 let saved=null;
 try{saved=JSON.parse(localStorage.getItem(KEY))}catch(e){}
 const current=saved&&Array.isArray(saved.receipts)?{...blankState(),...saved}:blankState();
 // One-time non-destructive migration. Never re-insert after user deletion.
 if(!current.migrations?.binJahlanFirstReceipt){
   try{
     const imported=parseIncoming(sampleData());
     imported.id='binjahlan-20261027-2641300055637';
     imported.requiresReview=true;
     imported.notes='البيانات مقروءة مبدئيًا من فيديو الفاتورة؛ مجموع البنود 813.68 ر.س، بينما الإجمالي المطبوع 813.65 ر.س (فرق 0.03 ر.س). بعض الأسماء غير واضحة وتحتاج مراجعة. المبلغ والضريبة مستخرجان من الفاتورة الأصلية.';
     const exists=current.receipts.some(x=>(x.invoiceNo==='2641300055637'&&x.date==='2026-10-27')||receiptKey(x)===receiptKey(imported));
     if(!exists)current.receipts.push(imported);
     current.migrations={...(current.migrations||{}),binJahlanFirstReceipt:true};
     localStorage.setItem(KEY,JSON.stringify(current));
   }catch(e){console.warn('تعذر تهيئة فاتورة بن جحلان',e)}
 }
 return current;
}
let state=load(),tab='dashboard',month=thisMonth(),selStore='',q='',selectedKey='',draft=null,rawImport='',showSettingsSection='budget';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('تعذر حفظ البيانات. قد تكون مساحة التخزين ممتلئة؛ صدّر نسخة احتياطية ثم حرر مساحة.');return false}return true}
function toast(msg){let x=document.querySelector('#toast');x.textContent=msg;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),3200)}
const all=()=>state.receipts||[];
const rm=m=>all().filter(r=>(r.date||'').slice(0,7)===m);
const sum=(arr,fn)=>arr.reduce((s,r)=>s+cents(fn(r)),0)/100;
function fmtDate(d){if(!d)return'—';let a=d.split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:d}
function totalLines(r){return money((r.items||[]).reduce((n,i)=>n+money(i.total??(i.quantity*i.unitPrice)),0))}
function uniqStores(){return [...new Set(all().map(r=>r.store).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ar'))}
function receiptKey(r){return [r.store?.trim().toLowerCase(),r.date,r.invoiceNo||'',cents(r.total)].join('|')}
function norm(s){return String(s??'').trim().toLowerCase().replace(/[ًٌٍَُِّْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/\s+/g,' ').replace(/[\-–_.,،]/g,'')}
function itemKey(i){const bc=String(i.barcode||'').replace(/\D/g,'');return bc.length>=8?'barcode:'+bc:'name:'+norm(i.name)+'|'+norm(i.size||'')}
function groupItems(){let g=new Map();for(const r of all())for(const i of r.items||[]){if(!i.name)continue;let key=itemKey(i);if(!g.has(key))g.set(key,{key,name:i.name,barcode:i.barcode||'',size:i.size||'',rows:[]});g.get(key).rows.push({r,i,unitPrice:(i.quantity>0?money(i.total/i.quantity):money(i.unitPrice)),date:r.date,store:r.store})}return [...g.values()].sort((a,b)=>b.rows.length-a.rows.length||a.name.localeCompare(b.name,'ar'))}
function changeTab(s){tab=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,title])=>`<button data-tab="${id}" class="${tab===id?'active':''}" type="button">${title}</button>`).join('');document.getElementById('app').innerHTML=({dashboard:dashboard,receipts:receiptsView,prices:pricesView,budget:budgetView,import:importView,settings:settingsView})[tab]();}
const heading=(h,p,right='')=>`<div class="heading"><div><h2>${h}</h2><p>${p}</p></div>${right}</div>`;
const selectMonth=()=>`<div class="field"><label>الشهر</label><input class="input" type="month" id="month" value="${esc(month)}"></div>`;
const opts=(values,selected,first='الكل')=>`<option value="">${first}</option>`+values.map(x=>`<option value="${esc(x)}" ${x===selected?'selected':''}>${esc(x)}</option>`).join('');
const none=(txt,btn=false)=>`<div class="empty"><div class="illustr">◌</div><div>${esc(txt)}</div>${btn?'<button class="btn mt" data-action="new">إضافة أول فاتورة</button>':''}</div>`;
function barChart(items){if(!items.length)return none('ستظهر البيانات بعد إضافة فواتير');let peak=Math.max(...items.map(x=>x.v),1);return items.slice(0,9).map(x=>`<div class="storebar"><span title="${esc(x.name)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.name)}</span><div class="track"><div class="fill" style="width:${(x.v/peak*100).toFixed(1)}%"></div></div><strong style="font-size:12px;direction:ltr;text-align:left">${AED(x.v)}</strong></div>`).join('')}
function lineChart(points,unit='ر.س'){if(!points.length)return none('لا توجد بيانات للرسم');const W=700,H=244,L=59,R=18,T=22,B=39,innerW=W-L-R,innerH=H-T-B;const vals=points.map(p=>Number(p.v)||0),max=Math.max(1,...vals),min=Math.min(0,...vals),range=max-min||1;const x=i=>L+(points.length===1?innerW/2:i/(points.length-1)*innerW),y=v=>T+(max-v)/range*innerH;const grid=[0,.25,.5,.75,1].map(z=>{let v=max-z*range,yy=y(v);return `<line x1="${L}" y1="${yy}" x2="${W-R}" y2="${yy}" stroke="#e4eaf0"/><text x="${L-8}" y="${yy+4}" font-size="12" text-anchor="end" fill="#728194">${v.toFixed(v>=10?0:1)}</text>`}).join('');const poly=points.map((p,i)=>`${x(i)},${y(vals[i])}`).join(' ');const dots=points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(vals[i])}" r="5" fill="#0a8377"><title>${esc(p.name)}: ${AED(p.v)}</title></circle>`).join('');const labels=points.map((p,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="#7b8797">${esc(String(p.short||p.name).slice(0,11))}</text>`).join('');return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني لقيم الإنفاق والسعر">${grid}<polyline points="${poly}" fill="none" stroke="#0a8377" stroke-width="3" stroke-linejoin="round"/>${dots}${labels}</svg><div class="chart-caption">${esc(unit)} • مرر على النقاط لعرض التفاصيل</div>`}
function dashboard(){const rs=rm(month),p=rm(prevMonth(month)),total=sum(rs,r=>r.total),vat=sum(rs,r=>r.vat),before=sum(rs,r=>r.subtotal),prev=sum(p,r=>r.total),shops=new Set(rs.map(r=>r.store)).size;const byStore=[...new Set(rs.map(r=>r.store))].map(name=>({name,v:sum(rs.filter(x=>x.store===name),r=>r.total)})).sort((a,b)=>b.v-a.v);const byCat={};for(const r of rs)for(const i of r.items||[])byCat[i.category||'أخرى']=money((byCat[i.category||'أخرى']||0)+i.total);const catItems=Object.entries(byCat).map(([name,v])=>({name,v})).sort((a,b)=>b.v-a.v);const monthlyProducts=new Map();for(const r of rs)for(const i of r.items||[]){let k=itemKey(i),entry=monthlyProducts.get(k)||{name:i.name,v:0};entry.v=money(entry.v+i.total);monthlyProducts.set(k,entry)}const topProducts=[...monthlyProducts.values()].sort((a,b)=>b.v-a.v).slice(0,8);const alerts=groupItems().map(g=>{const rr=g.rows.slice().sort((a,b)=>a.date.localeCompare(b.date));if(rr.length<2)return null;const last=rr[rr.length-1],prior=rr[rr.length-2],pct=prior.unitPrice?100*(last.unitPrice-prior.unitPrice)/prior.unitPrice:0;return last.date.slice(0,7)===month&&pct>=10?{name:g.name,pct,prior:prior.unitPrice,last:last.unitPrice,store:last.store,reliable:g.key.startsWith('barcode:')}:null}).filter(Boolean).sort((a,b)=>b.pct-a.pct);const months=Array.from({length:6},(_,k)=>{let d=new Date(Number(month.slice(0,4)),Number(month.slice(5,7))-1-(5-k),1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}).map(m=>({name:m,short:m.slice(5),v:sum(rm(m),r=>r.total)}));const remaining=money(state.budget-total);let delta=prev?((total-prev)/prev*100):null;return heading('لوحة التحكم','نظرة مركزة على الإنفاق والضريبة واتجاه الأسعار',`<div class="row">${selectMonth()}<button class="btn" data-action="new">＋ إضافة فاتورة</button></div>`)+`<div class="grid grid4 mb"><div class="card kpi dark"><div class="label">إجمالي المشتريات</div><div class="value">${AED(total)}</div><div class="extra">${NUM(rs.length)} فواتير • ${NUM(shop function editorView(){let computed=totalLines(draft),diff=money(computed-draft.total),ok=Math.abs(cents(diff))<=1;return `<div class="card" id="editor"><div class="heading"><div><h2>${draft._editing?'تعديل الفاتورة':'مراجعة الفاتورة قبل الحفظ'}</h2><p>يمكن تصحيح أي اسم أو سعر أو كمية، أو إضافة بند مفقود</p></div><button class="btn alt" data-action="cancel">إلغاء</button></div><div class="controls mb"><div class="field"><label>المتجر</label><input id="edStore" class="input" value="${esc(draft.store)}"></div><div class="field"><label>الفرع</label><input id="edBranch" class="input" value="${esc(draft.branch||'')}"></div><div class="field"><label>التاريخ</label><input id="edDate" class="input" type="date" value="${esc(draft.date)}"></div><div class="field"><label>رقم الفاتورة</label><input id="edInvoice" class="input" value="${esc(draft.invoiceNo||'')}"></div><div class="field"><label>الإجمالي قبل الضريبة</label><input id="edSubtotal" class="input" type="number" step="0.01" min="0" value="${draft.subtotal}"></div><div class="field"><label>الضريبة (من الفاتورة)</label><input id="edVat" class="input" type="number" step="0.01" min="0" value="${draft.vat}"></div><div class="field"><label>الإجمالي شامل الضريبة</label><input id="edTotal" class="input" type="number" step="0.01" min="0" value="${draft.total}"></div><div class="field"><label>مصدر البيانات</label><div class="subtle">${esc(draft.source||'إدخال يدوي')}</div></div></div><div class="row space-between"><h3 class="section-title" style="margin:0">المنتجات (${draft.items.length})</h3><button class="btn alt sm" data-action="additem">＋ إضافة صنف</button></div><div class="tblwrap mt"><table class="editor-table"><thead><tr><th>المنتج</th><th>الباركود</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th><th>الفئة</th><th></th></tr></thead><tbody>${draft.items.map((i,j)=>`<tr><td><input class="input" name="name" data-item="${j}" value="${esc(i.name)}" aria-label="اسم الصنف ${j+1}"></td><td><input class="input mono" name="barcode" data-item="${j}" value="${esc(i.barcode||'')}"></td><td><input class="input" name="quantity" data-item="${j}" type="number" step="0.001" min="0.001" style="width:78px" value="${i.quantity}"></td><td><input class="input" name="unitPrice" data-item="${j}" type="number" step="0.01" min="0" style="width:85px" value="${i.unitPrice}"></td><td><input class="input" name="total" data-item="${j}" type="number" step="0.01" min="0" style="width:85px" value="${i.total}"></td><td><select class="input" name="category" data-item="${j}">${CATS.map(c=>`<option ${c===i.category?'selected':''}>${c}</option>`).join('')}</select></td><td><button class="btn danger sm" data-action="removeitem" data-index="${j}">×</button></td></tr>`).join('')}</tbody></table></div><div class="grid grid3 mt"><div class="subtle">مجموع الأصناف <div class="bigN">${AED(computed)}</div></div><div class="subtle">الإجمالي الرسمي <div class="bigN">${AED(draft.total)}</div></div><div class="subtle">الفرق <div class="bigN" style="color:${ok?'var(--green)':'var(--red)'}">${AED(diff)}</div></div></div>${!ok?`<div class="alert bad">فرق مقداره ${AED(Math.abs(diff))} بين الأصناف والإجمالي الرسمي. راجع القراءة قبل الحفظ. قد يكون السبب تقريب الأسعار أو صنف مفقود.</div>`:'<div class="alert info">✓ مجموع الأصناف متوافق مع الفاتورة ضمن هامش هللة واحدة.</div>'}<div class="row mt"><label class="row" style="gap:6px"><input type="checkbox" id="ackDiff" ${ok?'checked':''}><span>راجعت البيانات وأوافق على اعتمادها حتى لو وُجد فرق</span></label></div><div class="sticky-actions"><button class="btn" data-action="saveDraft">اعتماد الفاتورة وحفظها</button> <button class="btn alt" data-action="cancel">إلغاء</button></div></div>`}
const TEMPLATE=`استخرج الفاتورة من الصور/الفيديو كاملة وحوّلها إلى JSON فقط دون شروح أو علامات كود. حافظ على الأرقام المطبوعة كما هي ولا تخمّن صنفًا غير واضح؛ ضع اسمه "غير واضح" ليظهر للمراجعة. ضع أسعار الأصناف شاملة الضريبة كما في عمود الإجمالي. لا تستنتج ضريبة المنتجات؛ انسخ قيمة الضريبة المكتوبة بالفاتورة. استخدم هذا الشكل:\n{\n "store":"اسم المتجر", "branch":"الفرع", "date":"YYYY-MM-DD", "invoiceNo":"رقم الفاتورة",\n "subtotal":0, "vat":0, "total":0, "source":"فيديو عبر ChatGPT",\n "items":[{"name":"اسم الصنف وحجم العبوة", "barcode":"", "quantity":1, "unitPrice":10.00, "total":10.00, "category":"أخرى"}]\n}\nاذكر أي اختلاف بين مجموع الأصناف والإجمالي داخل حقل notes إن وُجد. لا تضف منتجات لم تظهر. استخدم أرقام عشرية عادية. لا تستخدم أي بيانات مثال أعلاه بوصفها بيانات الفاتورة الجديدة.`;
function sanitizeMoney(s){return Number(String(s??0).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٬,]/g,'').replace('٫','.'))||0}
function parseIncoming(raw){let obj;if(typeof raw==='string'){let t=raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');obj=JSON.parse(t)}else obj=raw;if(Array.isArray(obj))throw Error('ألصق فاتورة واحدة في المرة الواحدة');if(!obj||typeof obj!=='object')throw Error('الكود ليس فاتورة صالحة');if(obj.receipts&&Array.isArray(obj.receipts))throw Error('هذا ملف نسخة احتياطية، استورده من الإعدادات');let products=obj.items||obj.products||obj.lines||[];if(!Array.isArray(products))throw Error('لا توجد قائمة منتجات');let r={id:obj.id||uuid(),store:String(obj.store||obj.merchant||obj.shop||'').trim(),branch:String(obj.branch||''),date:String(obj.date||today()).slice(0,10),invoiceNo:String(obj.invoiceNo||obj.invoice_no||obj.transactionNo||''),subtotal:money(sanitizeMoney(obj.subtotal??obj.beforeTax)),vat:money(sanitizeMoney(obj.vat??obj.tax??obj.vatTotal)),total:money(sanitizeMoney(obj.total??obj.grandTotal??obj.grand_total)),source:String(obj.source||'ChatGPT'),notes:String(obj.notes||''),items:products.map(p=>{let qty=sanitizeMoney(p.quantity??p.qty??1),u=sanitizeMoney(p.unitPrice??p.unit_price??p.price),hasTotal=p.total!=null||p.lineTotal!=null;let tot=hasTotal?sanitizeMoney(p.total??p.lineTotal):money(qty*u);if(!u&&qty)u=money(tot/qty);return {name:String(p.name||p.product||p.description||'').trim(),barcode:String(p.barcode||p.ean||''),quantity:qty||1,unitPrice:money(u),total:money(tot),category:CATS.includes(p.category)?p.category:'أخرى',size:String(p.size||'')}})};if(!r.store)throw Error('اسم المتجر غير موجود');if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date))throw Error('التاريخ يجب أن يكون YYYY-MM-DD');if(!r.total&&!r.items.length)throw Error('الفاتورة لا تحتوي على مبلغ أو منتجات');if(!r.subtotal&&r.total)r.subtotal=money(r.total-r.vat);if(!r.total&&r.subtotal)r.total=money(r.subtotal+r.vat);return r}
function newDraft(){draft={id:uuid(),store:'',branch:'',date:today(),invoiceNo:'',subtotal:0,vat:0,total:0,source:'يدوي',items:[{name:'',barcode:'',quantity:1,unitPrice:0,total:0,category:'أخرى'}]};tab='import';render();document.getElementById('editor')?.scrollIntoView({block:'start',behavior:'smooth'})}
function edFields(){if(!draft)return;const pairs={store:'edStore',branch:'edBranch',date:'edDate',invoiceNo:'edInvoice',subtotal:'edSubtotal',vat:'edVat',total:'edTotal'};for(let [k,id] of Object.entries(pairs)){let el=document.getElementById(id);if(el)draft[k]=['subtotal','vat','total'].includes(k)?money(sanitizeMoney(el.value)):el.value} }
function refreshEditor(){let node=document.getElementById('editor');if(node){node.outerHTML=editorView()}}
function sampleData(){const data=[
['خس',1,1.75,'خضار وفواكه'],['مخابز بن جحلان',2,2,'مخبوزات'],['هيل رقم ١',1,77.5,'بهارات'],['داوني للبشرة الحساسة ٣ لتر',1,37.95,'منظفات'],['مرتديلا دجاج رضوى ٢٥٠ غرام',6,51.75,'لحوم ودواجن'],['جبنة كرافت ٥٠ غرام',4,12.01,'ألبان وأجبان'],['لفائف تورتيلا بيضاء',2,21.99,'مخبوزات'],['مشروب ٢٥٠ مل ـ غير واضح',1,8.63,'مشروبات'],['قهوة كلاسيكية بدون سكر',1,23.94,'مشروبات'],['صنف غير واضح ١٧٠ غرام',8,32.02,'أخرى'],['أعواد قرفة',1,42,'بهارات'],['أريال أزرق مركز',1,86,'منظفات'],['خبز بر لوزين',1,6.5,'مخبوزات'],['توست أبيض لوزين',3,16.49,'مخبوزات'],['خل أبيض',1,12.65,'معلبات'],['تونة قودي ٨٠ غرام',5,25.01,'معلبات'],['زيتون أخضر كوروليا',2,11.5,'معلبات'],['زيتون أسود كوروليا',2,11.5,'معلبات'],['حمص شتورة بالطحينة',2,4.99,'معلبات'],['مفروم غنم أمريكانا ٤٠٠ غرام',8,119.6,'لحوم ودواجن'],['مكرونة المائدة',1,12.65,'معلبات'],['قشطة التاج صغيرة',4,20.7,'ألبان وأجبان'],['بودرة ثوم ٨٥ غرام',1,16.68,'بهارات'],['صلصة بيتزا',1,17.25,'معلبات'],['مربى جلوريا',1,3.5,'حلويات'],['حليب وادي فاطمة بالمانجو',1,16.1,'ألبان وأجبان'],['كاتشب رنا',1,21.85,'معلبات'],['ستيفيانا مُحلٍّ',1,16.1,'أخرى'],['حليب المراعي نجوم بالشوكولاتة',1,13.95,'ألبان وأجبان'],['كريمة طبخ المراعي لتر',1,17.94,'ألبان وأجبان'],['زيتون أخضر الأحلام ٥٠٠ غرام',1,17.25,'معلبات'],['زيتون أسود الأحلام ٥٠٠ غرام',1,12.65,'معلبات'],['شراب الربيع فواكه وبرتقال',1,14.95,'مشروبات'],['فاصوليا بالطماطم لونا',1,2.88,'معلبات'],['عسل الشفاء ٢٥ غرام',4,3.45,'حلويات']];const obj={store:'مؤسسة سالم محمد بن جحلان',branch:'المروج الثاني',date:'2026-10-27',invoiceNo:'2641300055637',subtotal:707.52,vat:106.13,total:813.65,source:'فيديو الفاتورة عبر ChatGPT — يحتاج مراجعة',notes:'الأسماء الأولية غير مدققة والفارق بين مجموع البنود وإجمالي الفاتورة 0.03 ريال',items:data.map(([name,quantity,total,category])=>({name,quantity,total,unitPrice:money(total/quantity),barcode:'',category}))};return obj}
function sample(){const obj=sampleData();rawImport=JSON.stringify(obj,null,2);document.getElementById('jsonText').value=rawImport;draft=parseIncoming(obj);render();document.getElementById('editor')?.scrollIntoView({block:'start',behavior:'smooth'})}
function settingsView(){return heading('الإعدادات والنسخ الاحتياطية','الخصوصية، نقل البيانات بين الأجهزة، والنسخ والتصدير')+`<div class="grid grid2"><div class="card"><div class="section-title">نسخة احتياطية كاملة</div><p>تحتوي كل الفواتير وأصنافها ومتاجرها وحدود الميزانية. احفظها في مكان آمن، وأعد استيرادها عند تغيير الهاتف أو المتصفح.</p><div class="twoButtons"><button class="btn" data-action="export">تنزيل نسخة JSON</button><button class="btn alt" data-action="csv">تصدير الأصناف CSV</button><label class="btn alt filebtn">استعادة نسخة<input id="backupFile" type="file" accept="application/json,.json"></label></div><div class="alert info">البيانات محلية في المتصفح وليست متزامنة بين الأجهزة. تحديث الموقع لا يحذفها عادةً، لكن مسح بيانات المتصفح أو تغيير الجهاز قد يفقدها.</div></div><div class="card"><div class="section-title">حالة البيانات</div><div class="vspace"><div class="row space-between"><span>الفواتير</span><strong>${NUM(all().length)}</strong></div><div class="divider"></div><div class="row space-between"><span>المتاجر</span><strong>${NUM(uniqStores().length)}</strong></div><div class="divider"></div><div class="row space-between"><span>المنتجات الفريدة</span><strong>${NUM(groupItems().length)}</strong></div><div class="divider"></div><div class="row space-between"><span>مكان التخزين</span><strong>هذا الجهاز / المتصفح</strong></div></div><div class="divider"></div><button class="btn danger sm" data-action="clear">حذف جميع بيانات هذا البرنامج</button></div><div class="card"><div class="section-title">مبدأ مطابقة المنتجات</div><p>الأولوية للباركود نفسه. إذا لم يوجد، تُستخدم مطابقة الاسم والحجم ويظهر تحذير. لا نعتبر عبوة ٤٠٠ غرام هي نفس عبوة ١ كيلو، ولا نقارن السعر للوحدة دون مراعاة الكمية.</p><p class="help">مصدر السعر الوحيد هو الفواتير التي تستوردها، لا توجد أسعار مباشرة من المتاجر. وإذا أردت مزامنة لاحقًا، فيمكن إضافة قاعدة بيانات سحابية مستقلة.</p></div><div class="card"><div class="section-title">صيغة التبادل مع ChatGPT</div><p>يمكنك نقل المنتجات عبر JSON في تبويب الاستيراد. الرمز QR الضريبي لا يحتوي أصناف الفاتورة؛ فيديو/صور الإيصال هو المصدر الحقيقي للأصناف.</p><button class="btn alt" data-action="copyprompt">نسخ تعليمات استخراج الفاتورة</button></div></div>`}
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const rows=[['التاريخ','المتجر','الفرع','رقم الفاتورة','الصنف','الباركود','الفئة','الكمية','سعر الوحدة','الإجمالي','ضريبة الفاتورة','إجمالي الفاتورة']];for(const r of all())for(const i of r.items||[])rows.push([r.date,r.store,r.branch,r.invoiceNo,i.name,i.barcode,i.category,i.quantity,i.unitPrice,i.total,r.vat,r.total]);return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')}
function saveDraft(){edFields();if(!draft.store.trim())return alert('اكتب اسم المتجر');if(!/^\d{4}-\d{2}-\d{2}$/.test(draft.date))return alert('التاريخ غير صحيح');if(!(draft.total>0))return alert('ضع إجماليًا صحيحًا');if(draft.vat<0||draft.vat>draft.total)return alert('قيمة الضريبة غير صالحة');if(Math.abs(cents(money(draft.total-draft.subtotal-draft.vat)))>2)return alert('الإجمالي لا يطابق قبل الضريبة + الضريبة. راجع الأرقام.');if(!(draft.items||[]).length||draft.items.some(i=>!i.name.trim()||i.quantity<=0||i.total<0))return alert('أكمل أسماء الأصناف والكميات والأسعار');let diff=cents(totalLines(draft))-cents(draft.total);if(Math.abs(diff)>1&&!document.getElementById('ackDiff')?.checked)return alert('يوجد فرق بين مجموع البنود والإجمالي. راجعها ثم أكد الموافقة');if(all().some(r=>r.id!==draft.id&&receiptKey(r)===receiptKey(draft)))return alert('توجد فاتورة مسجلة بالفعل بنفس المتجر والتاريخ والمبلغ ورقم الفاتورة');let idx=all().findIndex(r=>r.id===draft.id);let rec=JSON.parse(JSON.stringify(draft));delete rec._editing;rec.requiresReview=false;if(idx<0)state.receipts.push(rec);else state.receipts[idx]=rec;if(!save())return;draft=null;rawImport='';month=rec.date.slice(0,7);tab='receipts';render();toast('✓ تم اعتماد الفاتورة وتحديث جميع التقارير')}
function bindEvents(){document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)changeTab(b.dataset.tab)});document.getElementById('quickAdd').onclick=newDraft;document.getElementById('app').addEventListener('input',e=>{let t=e.target;if(t.id==='search'){q=t.value;/* preserve typing */const pos=t.selectionStart;render();const el=document.getElementById('search');if(el){el.focus();el.setSelectionRange(pos,pos)}return}if(t.id==='jsonText'){rawImport=t.value;return}if(t.hasAttribute('data-item')&&draft){let idx=Number(t.dataset.item),k=t.name;let v=['quantity','unitPrice','total'].includes(k)?money(sanitizeMoney(t.value)):t.value;draft.items[idx][k]=v;if(k==='quantity'||k==='unitPrice'){draft.items[idx].total=money(draft.items[idx].quantity*draft.items[idx].unitPrice)}if(k==='total'&&draft.items[idx].quantity){draft.items[idx].unitPrice=money(draft.items[idx].total/draft.items[idx].quantity)}return}});
document.getElementById('app').addEventListener('change',e=>{let t=e.target;if(t.id==='month'){month=t.value;render();return}if(t.id==='storeFilter'){selStore=t.value;render();return}if(t.id==='productSelect'){selectedKey=t.value;render();return}if(t.hasAttribute('data-item')){let k=t.name,idx=Number(t.dataset.item);if(draft){draft.items[idx][k]=['quantity','unitPrice','total'].includes(k)?money(sanitizeMoney(t.value)):t.value;edFields();refreshEditor()}return}if(t.id==='receiptFile'){let f=t.files?.[0];if(f)f.text().then(s=>{rawImport=s;document.getElementById('jsonText').value=s;toast('تم تحميل الملف. اضغط قراءة ومراجعة');}).catch(()=>alert('تعذر قراءة الملف'));return}if(t.id==='backupFile'){let f=t.files?.[0];if(f)f.text().then(s=>{let o=JSON.parse(s);if(!o||!Array.isArray(o.receipts))throw Error('نسخة غير صالحة');if(!confirm(`سيتم استبدال البيانات المحلية بـ ${o.receipts.length} فاتورة من النسخة. هل توافق؟`))return;state={...blankState(),...o};save();render();toast('تمت استعادة النسخة')}).catch(e=>alert(e.message));return}});
document.getElementById('app').addEventListener('click',async e=>{let b=e.target.closest('[data-action]');if(!b)return;let act=b.dataset.action,id=b.dataset.id;if(act==='new'){newDraft();return}if(act==='copyprompt'){try{await navigator.clipboard.writeText(TEMPLATE);toast('تم نسخ القالب، الصقه في محادثة الفاتورة')}catch(e){prompt('انسخ النص التالي:',TEMPLATE)}return}if(act==='parse'){try{rawImport=getInputVal('jsonText');draft=parseIncoming(rawImport);render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'})}catch(err){alert('تعذر قراءة JSON: '+err.message)}return}if(act==='sample'){sample();return}if(act==='cancel'){draft=null;render();return}if(act==='additem'){edFields();draft.items.push({name:'',barcode:'',quantity:1,unitPrice:0,total:0,category:'أخرى'});refreshEditor();return}if(act==='removeitem'){edFields();draft.items.splice(Number(b.dataset.index),1);refreshEditor();return}if(act==='saveDraft'){saveDraft();return}if(act==='view'){let r=all().find(r=>r.id===id);if(!r)return;alert([`المتجر: ${r.store}`,`التاريخ: ${fmtDate(r.date)}`,`الإجمالي: ${AED(r.total)}`,`الضريبة: ${AED(r.vat)}`,'— الأصناف —',...r.items.map(i=>`${i.name} × ${i.quantity} = ${AED(i.total)}`)].join('\n'));return}if(act==='edit'){let r=all().find(r=>r.id===id);if(!r)return;draft=JSON.parse(JSON.stringify(r));draft._editing=true;tab='import';render();document.getElementById('editor')?.scrollIntoView({behavior:'smooth'});return}if(act==='delete'){let r=all().find(r=>r.id===id);if(r&&confirm(`حذف فاتورة ${r.store} بتاريخ ${r.date} بقيمة ${AED(r.total)}؟`)){state.receipts=all().filter(x=>x.id!==id);save();render();toast('تم حذف الفاتورة')}return}if(act==='savebudget'){state.budget=money(sanitizeMoney(getInputVal('budgetInput')));save();render();toast('حُفظت الميزانية');return}if(act==='savecatbudgets'){document.querySelectorAll('[data-category-budget]').forEach(el=>state.catBudgets[el.dataset.category]=money(sanitizeMoney(el.value)));save();render();toast('حُفظت حدود الفئات');return}if(act==='export'){download('rasid-backup-'+today()+'.json',JSON.stringify(state,null,2),'application/json;charset=utf-8');return}if(act==='csv'){download('rasid-products-'+today()+'.csv',exportCSV(),'text/csv;charset=utf-8');return}if(act==='clear'){if(confirm('هل أنت متأكد؟ سيُحذف جميع سجل الفواتير والميزانية من هذا المتصفح. ننصح بتصدير نسخة أولًا.')&&confirm('تأكيد نهائي: حذف جميع بيانات راصد المشتريات؟')){state={...blankState(),migrations:{...(state.migrations||{}),binJahlanFirstReceipt:true}};save();render()}return}})}
bindEvents();render();
